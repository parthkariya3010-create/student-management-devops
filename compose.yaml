
services:
  student-management:
    build: .
    container_name: student-management-app
    ports:
      - "5000:5000"
    environment:
      DB_PATH: /data/students.db
      SECRET_KEY: change-this-for-local-development
    volumes:
      - student_data:/data
    restart: unless-stopped

volumes:
  student_data:
